<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CableCrew Planner – Firebase TEST</title>
<style>
:root{
  --bg:#f2f6f9;--card:#fff;--line:#d6e0e8;--text:#102030;--muted:#64748b;--navy:#0f4b6d;
  --pro:#f4cccc;--rookie:#d9ead3;--two:#d9e6f7;--standby:#fff2cc;--foil:#e6dcf7;--tt:#d9eeee;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px}
.header-inner{max-width:1280px;margin:auto;display:flex;align-items:center;gap:12px}
.brand{font-size:22px;font-weight:900}.status{margin-left:auto;font-size:13px;color:var(--muted)}
.quickbar{max-width:1280px;margin:12px auto 0;padding:0 14px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.quickcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:76px}
.quicktitle{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.quickvalue{font-weight:800;margin-top:6px;line-height:1.35}.weatherline{display:flex;align-items:center;gap:9px}.weathericon{font-size:25px}
main{max-width:1280px;margin:auto;padding:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button,select,input,textarea{font:inherit}
button,select,input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
button{cursor:pointer;font-weight:800}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.danger{background:#a33;color:#fff;border-color:#a33}.success{background:#287a52;color:#fff;border-color:#287a52}
.viewbtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.admin-login{margin-left:auto}.adminbar{display:none;background:#fff4d8;border:1px solid #ead39b;border-radius:12px;padding:10px 12px;margin-bottom:12px;gap:8px;align-items:center;flex-wrap:wrap}
.adminbar.show{display:flex}.adminbar strong{margin-right:auto}.editToggle.on{background:#ef8f00;color:#fff;border-color:#ef8f00;font-size:16px}
.panel{display:none}.panel.active{display:block}
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.zone{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.zone h2{font-size:20px;margin:0;padding:12px 16px}.pro h2{background:var(--pro)}.rookie h2{background:var(--rookie)}.two h2{background:var(--two)}.standby h2{background:var(--standby)}.foil h2{background:var(--foil)}.tt h2{background:var(--tt)}
.shift{padding:11px 16px;border-top:1px solid #edf1f4;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.shift:first-of-type{border-top:0}
.shift.editable{cursor:pointer}.shift.editable:hover{background:#fff8e8;outline:2px solid #f0b95d}.time{white-space:nowrap;color:#41505c}.note{font-size:12px;color:var(--muted);font-style:italic;margin-top:3px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.week-day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;min-width:0}.week-day h3{margin:0 0 8px;font-size:14px}.mini-zone{margin-bottom:8px}.mini-title{font-size:11px;font-weight:900;padding:4px 6px;border-radius:6px}.mini-shift{font-size:11px;padding:3px 1px;cursor:default}.mini-shift.editable{cursor:pointer}.mini-shift.editable:hover{text-decoration:underline}
.empty{color:var(--muted);font-style:italic;padding:10px 0}
.modalback{display:none;position:fixed;inset:0;background:rgba(10,25,35,.45);z-index:100;padding:18px;align-items:center;justify-content:center}.modalback.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:18px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal h2{margin-top:0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid label{font-size:12px;font-weight:800;color:#51606b}.formgrid input,.formgrid select,.formgrid textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px}.wide{grid-column:1/-1}.modalactions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.loginbox{display:grid;gap:10px}.loginbox input{width:100%}
@media(max-width:900px){.week-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.quickbar,.day-grid{grid-template-columns:1fr}.week-grid{grid-template-columns:1fr}.status{display:none}.admin-login{margin-left:0}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
@media print{header,.quickbar,.toolbar,.adminbar,.modalback{display:none!important}body{background:#fff}.panel{display:none!important}#week.panel{display:block!important}.week-grid{grid-template-columns:repeat(7,1fr);gap:2mm}.week-day{border-radius:2mm;padding:2mm}.mini-shift{font-size:8pt}.mini-title{font-size:8pt}}
@page{size:A4 landscape;margin:7mm}
</style>
</head>
<body>
<header><div class="header-inner">
  <div class="brand">CableCrew Lakeside</div>
  <div id="syncStatus" class="status">Verbinden…</div>
</div></header>

<div class="quickbar">
  <div class="quickcard"><div class="quicktitle">🌤️ Weer Knokke-Heist</div><div id="weather" class="quickvalue weatherline">Weer laden…</div></div>
  <div class="quickcard"><div class="quicktitle">👥 Wie werkt vandaag?</div><div id="workingToday" class="quickvalue">Planning laden…</div></div>
  <div class="quickcard"><div class="quicktitle">👤 Mijn planning</div><div class="quickvalue"><select id="myEmployee"><option value="">Kies je naam</option></select></div></div>
</div>

<main>
  <div class="toolbar">
    <button class="viewbtn active" data-view="day">Dag</button>
    <button class="viewbtn" data-view="week">Week</button>
    <select id="date"></select>
    <div class="admin-login"><button id="loginBtn">🔐 Beheer login</button></div>
  </div>

  <div id="adminBar" class="adminbar">
    <strong id="adminWho">Beheer</strong>
    <button id="editToggle" class="editToggle">✏️ BEWERKEN</button>
    <button id="addShiftBtn">+ Shift</button>
    <button id="copyWeekBtn">Week kopiëren</button>
    <button id="printBtn">Week afdrukken</button>
    <button id="importBtn" class="success" style="display:none">Huidige planning online zetten</button>
    <button id="logoutBtn">Uitloggen</button>
  </div>

  <section id="day" class="panel active"><div id="dayGrid" class="day-grid"></div></section>
  <section id="week" class="panel"><div id="weekGrid" class="week-grid"></div></section>
</main>

<div id="loginModal" class="modalback"><div class="modal">
  <h2>Beheer login</h2>
  <div class="loginbox">
    <input id="loginEmail" type="email" placeholder="E-mailadres">
    <input id="loginPassword" type="password" placeholder="Wachtwoord">
    <div id="loginError" style="color:#a33;font-size:13px"></div>
  </div>
  <div class="modalactions"><button id="cancelLogin">Annuleren</button><button id="doLogin" class="primary">Inloggen</button></div>
</div></div>

<div id="shiftModal" class="modalback"><div class="modal">
  <h2 id="shiftTitle">Shift</h2>
  <div class="formgrid">
    <label>Datum<input id="editDate" type="date"></label>
    <label>Medewerker<select id="editEmployee"></select></label>
    <label>Startuur<input id="editStart" type="time"></label>
    <label>Einduur<input id="editEnd" type="time"></label>
    <label class="wide">Zone<select id="editZone">
      <option>PRO</option><option>ROOKIE</option><option>2.0</option><option>STANDBY</option><option>FOIL</option><option>TT / SP / KIDSSESSION</option>
    </select></label>
    <label class="wide">Opmerking<textarea id="editNote" rows="2"></textarea></label>
  </div>
  <div class="modalactions">
    <button id="deleteShift" class="danger">Verwijderen</button>
    <button id="duplicateShift">Dupliceren</button>
    <button id="cancelShift">Annuleren</button>
    <button id="saveShift" class="success">Opslaan</button>
  </div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdeGM27e5xNRGipmEeQzmTW4aNMrKtc3A",
  authDomain: "cable-crew-planner.firebaseapp.com",
  projectId: "cable-crew-planner",
  storageBucket: "cable-crew-planner.firebasestorage.app",
  messagingSenderId: "179845869941",
  appId: "1:179845869941:web:3a4c640053c9eaf9f9e33c"
};

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const $=id=>document.getElementById(id);
const zones=["PRO","ROOKIE","2.0","STANDBY","FOIL","TT / SP / KIDSSESSION"];
const css={"PRO":"pro","ROOKIE":"rookie","2.0":"two","STANDBY":"standby","FOIL":"foil","TT / SP / KIDSSESSION":"tt"};
let shifts=[], fallbackShifts=[], firestoreReady=false, user=null, editMode=false, editing=null, currentView="day";

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function mondayOf(k){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function label(k){return new Date(k+"T12:00:00").toLocaleDateString("nl-BE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function sorted(a){return [...a].sort((x,y)=>x.date.localeCompare(y.date)||x.start.localeCompare(y.start)||x.zone.localeCompare(y.zone)||x.employee.localeCompare(y.employee))}
function visibleShifts(){const n=$("myEmployee").value;return n?shifts.filter(x=>x.employee===n):shifts}

async function loadFallback(){
 try{
   const r=await fetch("./planning.json?ts="+Date.now(),{cache:"no-store"});
   if(!r.ok)throw Error();
   const d=await r.json();fallbackShifts=sorted((d.shifts||[]).map(x=>({...x})));
 }catch(e){fallbackShifts=[]}
}

function initDateOptions(){
 const dates=[...new Set(shifts.map(x=>x.date))].sort();
 const old=$("date").value;
 $("date").innerHTML=dates.map(d=>`<option value="${d}">${label(d)}</option>`).join("");
 if(!dates.length)return;
 const today=key(new Date());
 let chosen=old&&dates.includes(old)?old:(dates.includes(today)?today:dates.reduce((best,d)=>Math.abs(new Date(d)-new Date(today))<Math.abs(new Date(best)-new Date(today))?d:best,dates[0]));
 $("date").value=chosen;
}
function people(){return [...new Set(shifts.map(x=>x.employee))].filter(Boolean).sort()}
function fillPeople(){
 const p=people(), old=$("myEmployee").value||localStorage.getItem("cc_my_name")||"";
 $("myEmployee").innerHTML='<option value="">Kies je naam</option>'+p.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("");
 if(p.includes(old))$("myEmployee").value=old;
 $("editEmployee").innerHTML=p.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join("")+'<option value="__NEW__">+ Nieuwe medewerker…</option>';
}
function renderToday(){
 const rows=shifts.filter(x=>x.date===key(new Date())), names=[...new Set(rows.map(x=>x.employee))].sort();
 $("workingToday").textContent=names.length?names.join(", "):"Geen crew ingepland";
}
function shiftHtml(x){
 return `<div class="shift ${editMode?'editable':''}" data-id="${esc(x._id||'')}">
   <div><b>${esc(x.employee)}</b>${x.note?`<div class="note">${esc(x.note)}</div>`:""}</div>
   <div class="time">${esc(x.start)}–${esc(x.end)}</div></div>`;
}
function renderDay(){
 const d=$("date").value, list=visibleShifts();
 $("dayGrid").innerHTML=zones.map(z=>{
   const rows=list.filter(x=>x.date===d&&x.zone===z);
   return `<section class="zone ${css[z]}"><h2>${esc(z)}</h2>${rows.length?rows.map(shiftHtml).join(""):'<div class="empty" style="padding:12px 16px">Geen planning</div>'}</section>`;
 }).join("");
}
function renderWeek(){
 const start=mondayOf($("date").value),list=visibleShifts();let html="";
 for(let i=0;i<7;i++){
   const d=new Date(start);d.setDate(d.getDate()+i);const dk=key(d);
   html+=`<section class="week-day"><h3>${d.toLocaleDateString("nl-BE",{weekday:"short",day:"numeric",month:"numeric"})}</h3>`;
   zones.forEach(z=>{
     const rows=list.filter(x=>x.date===dk&&x.zone===z);
     if(rows.length)html+=`<div class="mini-zone"><div class="mini-title" style="background:var(--${css[z]})">${esc(z)}</div>${rows.map(x=>`<div class="mini-shift ${editMode?'editable':''}" data-id="${esc(x._id||'')}"><b>${esc(x.employee)}</b> ${esc(x.start)}–${esc(x.end)}</div>`).join("")}</div>`;
   });
   html+=`</section>`;
 }
 $("weekGrid").innerHTML=html;
}
function renderAll(){initDateOptions();fillPeople();renderToday();renderDay();renderWeek()}

document.querySelectorAll(".viewbtn").forEach(b=>b.onclick=()=>{
 currentView=b.dataset.view;document.querySelectorAll(".viewbtn").forEach(x=>x.classList.toggle("active",x===b));
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===currentView));
});
$("date").onchange=()=>{renderDay();renderWeek()};
$("myEmployee").onchange=e=>{if(e.target.value)localStorage.setItem("cc_my_name",e.target.value);else localStorage.removeItem("cc_my_name");renderDay();renderWeek()};

function findShift(id){return shifts.find(x=>x._id===id)}
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-id]");if(!el||!editMode||!user)return;
 const x=findShift(el.dataset.id);if(x)openShift(x);
});

function openShift(x=null){
 editing=x;
 $("shiftTitle").textContent=x?"Shift aanpassen":"Nieuwe shift";
 $("editDate").value=x?.date||$("date").value;
 $("editEmployee").value=x?.employee||people()[0]||"";
 $("editStart").value=x?.start||"09:00";$("editEnd").value=x?.end||"17:00";
 $("editZone").value=x?.zone||"PRO";$("editNote").value=x?.note||"";
 $("deleteShift").style.display=x?"inline-block":"none";$("duplicateShift").style.display=x?"inline-block":"none";
 $("shiftModal").classList.add("show");
}
$("addShiftBtn").onclick=()=>openShift();
$("cancelShift").onclick=()=>$("shiftModal").classList.remove("show");
$("editEmployee").onchange=()=>{
 if($("editEmployee").value==="__NEW__"){
  const n=prompt("Naam nieuwe medewerker:");
  if(n){const o=document.createElement("option");o.value=n;o.textContent=n;$("editEmployee").insertBefore(o,$("editEmployee").lastElementChild);$("editEmployee").value=n}
  else $("editEmployee").value=editing?.employee||people()[0]||"";
 }
};
function formObj(){return {date:$("editDate").value,employee:$("editEmployee").value,start:$("editStart").value,end:$("editEnd").value,zone:$("editZone").value,note:$("editNote").value.trim()}}
$("saveShift").onclick=async()=>{
 const v=formObj();if(!v.date||!v.employee||!v.start||!v.end){alert("Vul datum, medewerker en uren in.");return}
 try{
   if(editing)await updateDoc(doc(db,"shifts",editing._id),v); else await addDoc(collection(db,"shifts"),v);
   $("shiftModal").classList.remove("show");
 }catch(e){alert("Opslaan mislukt: "+e.message)}
};
$("deleteShift").onclick=async()=>{if(editing&&confirm("Deze shift verwijderen?")){await deleteDoc(doc(db,"shifts",editing._id));$("shiftModal").classList.remove("show")}};
$("duplicateShift").onclick=async()=>{if(!editing)return;try{await addDoc(collection(db,"shifts"),formObj());$("shiftModal").classList.remove("show")}catch(e){alert(e.message)}};

$("editToggle").onclick=()=>{editMode=!editMode;$("editToggle").classList.toggle("on",editMode);$("editToggle").textContent=editMode?"✅ BEWERKEN AAN":"✏️ BEWERKEN";renderDay();renderWeek()};
$("printBtn").onclick=()=>window.print();

$("loginBtn").onclick=()=>$("loginModal").classList.add("show");
$("cancelLogin").onclick=()=>$("loginModal").classList.remove("show");
$("doLogin").onclick=async()=>{
 $("loginError").textContent="";
 try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value);$("loginModal").classList.remove("show");$("loginPassword").value=""}
 catch(e){$("loginError").textContent="Inloggen mislukt. Controleer e-mail en wachtwoord."}
};
$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
 user=u;$("adminBar").classList.toggle("show",!!u);$("loginBtn").style.display=u?"none":"inline-block";
 $("adminWho").textContent=u?`🔧 Beheer: ${u.email}`:"Beheer";
 if(!u){editMode=false;$("editToggle").classList.remove("on");$("editToggle").textContent="✏️ BEWERKEN"}
 updateImportButton();renderDay();renderWeek();
});

function updateImportButton(){
 $("importBtn").style.display=(user&&firestoreReady&&shifts.length===0&&fallbackShifts.length)?"inline-block":"none";
}
$("importBtn").onclick=async()=>{
 if(!user||!fallbackShifts.length)return;
 if(!confirm(`${fallbackShifts.length} bestaande shifts éénmalig naar Firebase kopiëren?`))return;
 try{
   for(let i=0;i<fallbackShifts.length;i+=450){
     const batch=writeBatch(db);
     fallbackShifts.slice(i,i+450).forEach(x=>{
       const ref=doc(collection(db,"shifts"));
       batch.set(ref,{date:x.date,employee:x.employee,start:x.start,end:x.end,zone:x.zone,note:x.note||""});
     });
     await batch.commit();
   }
   alert("De huidige planning staat nu online in Firebase.");
 }catch(e){alert("Import mislukt: "+e.message)}
};

await loadFallback();

onSnapshot(collection(db,"shifts"),snap=>{
 firestoreReady=true;
 const online=snap.docs.map(d=>({_id:d.id,...d.data()}));
 if(online.length){
   shifts=sorted(online);$("syncStatus").textContent="🟢 Live planning";
 }else{
   shifts=sorted(fallbackShifts.map((x,i)=>({...x,_id:"fallback_"+i})));
   $("syncStatus").textContent=fallbackShifts.length?"🟠 Huidige JSON (nog niet online geïmporteerd)":"⚪ Nog geen planning";
 }
 updateImportButton();renderAll();
},err=>{
 firestoreReady=false;shifts=sorted(fallbackShifts.map((x,i)=>({...x,_id:"fallback_"+i})));
 $("syncStatus").textContent="🔴 Firebase niet bereikbaar – JSON-weergave";renderAll();
});

function weatherIcon(c){if(c===0)return"☀️";if([1,2].includes(c))return"🌤️";if(c===3)return"☁️";if([45,48].includes(c))return"🌫️";if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c))return"🌧️";if([71,73,75,77,85,86].includes(c))return"🌨️";if([95,96,99].includes(c))return"⛈️";return"🌤️"}
async function loadWeather(){
 try{
   const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=51.35&longitude=3.29&current=temperature_2m,weather_code,wind_speed_10m&hourly=precipitation_probability&timezone=Europe%2FBrussels&forecast_days=1",{cache:"no-store"});
   const d=await r.json(),c=d.current||{};let rain="";
   if(d.hourly?.time?.length){let bi=0,bd=Infinity,now=new Date();d.hourly.time.forEach((t,i)=>{const z=Math.abs(new Date(t)-now);if(z<bd){bd=z;bi=i}});const ch=d.hourly.precipitation_probability?.[bi];if(ch!=null)rain=` · regen ${Math.round(ch)}%`}
   $("weather").innerHTML=`<span class="weathericon">${weatherIcon(c.weather_code)}</span><span>${Math.round(c.temperature_2m)}°C · wind ${Math.round(c.wind_speed_10m)} km/u${rain}</span>`;
 }catch(e){$("weather").textContent="Weer tijdelijk niet beschikbaar"}
}
loadWeather();
</script>
</body>
</html>
